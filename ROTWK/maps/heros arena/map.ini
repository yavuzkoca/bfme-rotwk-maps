// HEROES //

Object AngmarHwaldar
	ReplaceModule ModuleTag_RespawnUpdate
		Behavior = RespawnUpdate ModuleTag_RespawnUpdate1
			DeathAnim				= DYING ;STUNNED			;Model condition to play when killed-to-respawn
			DeathFX				= FX_AngmarHwaldarDieToRespawn		;FXList to play when killed-to-respawn
			DeathAnimationTime		= 6033 ; 1133			;How long DeathAnim will take.
			InitialSpawnFX			= FX_AngmarHwaldarInitialSpawn
			RespawnAnim				= LEVELED				;Animation to play when respawning.
			RespawnFX				= FX_LurtzRespawn			;FXList to play when respawning.
			RespawnAnimationTime		= 2000				;Time it takes for respawn to play.
			AutoRespawnAtObjectFilter	= NONE +CASTLE_KEEP		;Respawn at this location -- and at it's exit production point if possible.
			ButtonImage				= HIRecallHwalderIcon
		
		;RespawnEntries determine the ruleset for how a character can be revived. Some units may automatically respawn, others
		;may require a specific revive action performed on him. You can specify different values for each level... or use Level:Any
			RespawnRules =	AutoSpawn:No	Cost:1200		Time:10		Health:100%		;DEFAULT VALUES
			RespawnEntry =	Level:2		Cost:1300		Time:10					;For other levels, only override what is different.
			RespawnEntry =	Level:3		Cost:1400		Time:10
