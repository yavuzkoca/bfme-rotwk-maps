ChildObject DwarvenFortressExpansionPadCorner GondorWallFoundation
	CommandSet = NewGoodTowersCommandset
	VisionRange         = 800.0
  	ShroudClearingRange = 800.0
	KindOf = +CASTLE_KEEP

	AddModule
		Behavior = QueueProductionExitUpdate QueueProductionModuleTag
			UnitCreatePoint		= X:0.0 Y:0.0 Z:0.0
			NaturalRallyPoint	= X:100.0 Y:0.0 Z:0.0					; needs to be far away to prevent units walking through the structure.
			ExitDelay		= STANDARD_HORDE_EXIT_DELAY
			UseReturnToFormation	= No
		End
	End

	AddModule
		Behavior = ProductionUpdate ProductionUpdateModuleTag
			ProductionModifier		
				TimeMultiplier = 1
				HeroPurchase = Yes	; Instead of an object filter, needs to be explicitly hero-revival-system compatible
				ModifierFilter = NONE +HERO
			End

			GiveNoXP = Yes
		End
	End
End

