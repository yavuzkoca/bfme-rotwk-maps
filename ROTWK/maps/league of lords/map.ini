CommandSet EmptyCommandSet1   
	1  = Command_Stop
	2  = Command_PorterExtinguishFire
End

Object DwarvenPorter
	CommandSet = EmptyCommandSet1
End

Object WOR_IsengardCastleBaseKeep
	RemoveModule ModuleTag_CommandSetDwarven
	RemoveModule ModuleTag_CommandSetMen
	RemoveModule ModuleTag_CommandSetAngmar
	RemoveModule ModuleTag_CommandSetElven
	RemoveModule ModuleTag_CommandSetMordor
	RemoveModule ModuleTag_CommandSetWild
	RemoveModule ModuleTag_CommandSetIsengard
	AddModule ModuleTag_SplashOfHealingWater_Ahh_Override
		Behavior = PassiveAreaEffectBehavior ModuleTag_SplashOfHealingWater_Ahh_Override
			EffectRadius			= GONDOR_WELL_AOE_RADIUS
			PingDelay			= 3000	;2000;msec
			HealPercentPerSecond		= 4%	;3%
			AllowFilter			= NONE +HERO
			NonStackable			= Yes
			HealFX				= FX_SpellHealUnitHealBuff
		End
	End
	CommandSet = EmptyCommandSet1
End

