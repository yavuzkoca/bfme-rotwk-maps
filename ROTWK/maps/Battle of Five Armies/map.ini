; *** ART Parameters *
	SelectPortrait         = KUDireWolfPortrait
	ButtonImage = WOR_DireWolvesIcon
	
	DescriptionStrategic = CONTROLBAR:LW_ToolTip_Beorn

ReplaceModule ModuleTag_DRAW
  Draw = W3DScriptedModelDraw ModuleTag_DRAW_Override

		DefaultModelConditionState
			Model				= CUBear_SKN
			Skeleton 			= CUBear_SKL
		End

		ModelConditionState = WEAPONSET_HERO_MODE
			Model              	= CUBear_SKN
			Skeleton 		= CUBear_SKL
		End

		AnimationState				=	STUNNED_FLAILING
			Animation				=	JustDie
				AnimationName       =	CUBear_RUNA
				AnimationMode       =	LOOP
			End
			Flags					=	RANDOMSTART
		End

		AnimationState				=	DYING SPLATTED
			Animation				=	Land
				AnimationName		=	CUBear_RUNA
				AnimationMode		=	ONCE
			End
		End

		AnimationState				=	DYING
			Animation				=	CUBear_DIEA
				AnimationName		=	CUBear_DIEA
				AnimationMode		=	ONCE
			End
		End

		AnimationState				=	STUNNED_STANDING_UP
			Animation				=	StandUp
				AnimationName       =	CUBear_RUNA
				AnimationMode       =	ONCE
				AnimationSpeedFactorRange = 1.5 1.5
			End
		End

		AnimationState				=	 STUNNED
			Animation				=	Land
				AnimationName       =	CUBear_RUNA
				AnimationMode       =	ONCE
			End
		End
		AnimationState				=	MOVING TURN_LEFT TURN_LEFT_HIGH_SPEED 
			Animation				=	MTurnLeft
			AnimationName	=	CUBear_WALKA
				AnimationMode		=	LOOP
			End
		End

		AnimationState				=	MOVING TURN_RIGHT TURN_RIGHT_HIGH_SPEED 
			Animation				=	MTurnRight
			AnimationName	=	CUBear_WALKA
				AnimationMode		=	LOOP
			End
		End

		AnimationState				=	MOVING TURN_LEFT 
			Animation				=	TurnRight
			AnimationName	=	CUBear_WALKA
				AnimationMode		=	LOOP
			End
		End

		AnimationState				=	MOVING TURN_RIGHT 
			Animation				=	TurnRight
			AnimationName	=	CUBear_WALKA
				AnimationMode		=	LOOP
			End
		End

		AnimationState				=	MOVING ACCELERATE 
			Animation				=	Accelerate
			AnimationName	=	CUBear_WALKA
				AnimationMode		=	LOOP
			End
			;ParticleSysBone			=	None CalvaryDustTrails
		End

		AnimationState				=	MOVING DECELERATE 
			Animation				=	Decelerate
			 AnimationName	=	CUBear_WALKA
			 AnimationMode		=	ONCE
			 AnimationSpeedFactorRange = 0.6 0.6
			End
		End
		
		AnimationState				=	MOVING BACKING_UP 
			Animation				=	BackingUp
			AnimationName	=	CUBear_WALKA
				AnimationMode		=	LOOP
			End
			Flags					=	RANDOMSTART  
		End

	AnimationState				=	MOVING 
		StateName			=	STATE_moving
		Animation			=	Moving
			AnimationName	=	CUBear_WALKA
			AnimationMode		=	LOOP
		End
 			Flags					=	RANDOMSTART
	End

		AnimationState				=	ATTACKING
			Animation				=	Attacking
				AnimationName		=	CUBear_IDLB
				AnimationMode		=	ONCE
				UseWeaponTiming		=	Yes
				AnimationBlendTime  =	10
			End
			Flags					=	RESTART_ANIM_WHEN_COMPLETE
		End

		AnimationState				=	SELECTED
			SimilarRestart			=   Yes
			Animation				=	IDLB
				AnimationName		=	CUBear_IDLB
				AnimationMode		=	LOOP
			End
			StateName				= AtAttentionIdle
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Idle" then CurDrawableSetTransitionAnimState("TRANS_Select") end
				if Prev == "STATE_Ready" then CurDrawableSetTransitionAnimState("TRANS_Select") end
			EndScript
		End

		TransitionState				=	TRANS_Select
			Animation           = IDLC
				AnimationName     = CUBear_IDLC
				AnimationMode   =	ONCE
				AnimationSpeedFactorRange = 0.7 1.3
			End
		End

		IdleAnimationState
		StateName					=   STATE_Idle
		Animation = IdleA
				AnimationName		=	CUBear_IDLA
				AnimationMode		=	ONCE
				AnimationBlendTime	=	10
			End
			Animation			=	IdleB
				AnimationName		=	CUBear_IDLB
				AnimationMode		=	ONCE
				AnimationBlendTime	=	10
			End
			Animation			=	IdleD
				AnimationName		=	CUBear_IDLD
				AnimationMode		=	ONCE
				AnimationBlendTime	=	10
			End
			Flags				=	RESTART_ANIM_WHEN_COMPLETE
		End
	End
End

