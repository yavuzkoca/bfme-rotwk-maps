;=====================
; Beorn's claw weapon
;=====================

Weapon SauronMace ; Big claw that causes MAJOR damgage;using original sauron mace
	IdleAfterFiringDelay = 0
	RadiusDamageAffects = ENEMIES NOT_SIMILAR ; this lists what are effected, set to enemies so allies rn't hurt by weapon
	DelayBetweenShots = 2000               ; time between shots, msec
	PreAttackDelay        = 1600		; time before the initial hit
	PreAttackType         = PER_ATTACK ; this attribute is for different types of weapons such as bows
	FiringDuration      = 1400 ; how long the weapon is active and on

	DamageNugget
		Damage			= 150 ;the damage made
		Radius			= 80 ;The radius of the damage
		DamageArc		= 75
		DamageType		= SIEGE ;The damage type, this effects the enemies armor set of that armor type
		DamageFXType	= MAGIC ;this is the FX type made when the enemy is damaged
		DeathType		= EXPLODED ;the type of death to be triggered when the enemy dies
		DamageSpeed		= 185.0 ;the damage speed it takes, 90 is about the same speed as a horse
	End

	DamageNugget
		Damage			= 500 ;the damage made
		Radius			= 80 ;The radius of the damage
		DamageArc		= 75
		DamageType		= HERO ;The damage type, this effects the enemies armor set of that armor type
		DamageFXType	= MAGIC ;the type of death to be triggered when the enemy dies
		DeathType		= EXPLODED ;the type of death to be triggered when the enemy dies
		DamageSpeed		= 185.0 ;the damage speed it takes, 90 is about the same speed as a horse

	End

	; Push back
	MetaImpactNugget				; A Nugget that throws things back with force
