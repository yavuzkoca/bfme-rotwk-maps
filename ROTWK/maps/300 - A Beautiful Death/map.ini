Object GondorTowerShieldGuard // start coding towershild unit. This is only 1 unit not the horde: they will not have formation (try addind the same CommandSet = of the towershieldguard horde)
CommandSet = NewGondorTowerShieldGuardCommandSet
	WeaponSet
		Conditions = WEAPONSET_HERO_MODE; WEAPONSET_TOGGLE_1; None 
		Weapon = PRIMARY    GondorTowerShieldGuardSword
		;AutoChooseSources = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End
	WeaponSet
		Conditions = None 
		Weapon 		= PRIMARY	GondorTowerShieldGuardSwordFAST
	End
AddModule
	Behavior = WeaponChangeSpecialPowerModule THING
		SpecialPowerTemplate 	= SpecialAbilityBerserkerLightTorch
		FlagsUsedForToggle	= WEAPONSET_TOGGLE_1
		ToggleOnSleepFrames 	= 0
		ToggleOffSleepFrames 	= 0
		ToggleOnAttributeModifier = ShieldsAttributes
	End
End
AddModule
	Behavior = HeroModeSpecialAbilityUpdate ModuleTag_AragornBladeMasterUpdate4   ; So the difference in SpecialAbility is that it takes timing from this Update, instead of simply firing.
		SpecialPowerTemplate    = SpecialAbilityBerserkerLightTorch
		HeroAttributeModifier	= ShieldsAttributes
		HeroEffectDuration		= 30000 ; this should sync with the auto ability delay re-fire time in commandButtons.ini
		UnpackTime              = 1 ; insant unpack
		TriggerSound			= AragornBladeMaster
	End
End
