// ; Both ; and // are used when u want make a comment
; These are the armor that have towershield guards when using shields with heavy armor and without heavy armor

Weapon GondorTowerShieldGuardSwordFAST
	LeechRangeWeapon		= Yes
	AttackRange				= 35.0
	MeleeWeapon				= Yes
	DelayBetweenShots		= 500
	ClipSize				= INFINITE_CLIP_SIZE
	PreAttackDelay			= 250 ; 400 is sword swing delay time before contact with target.
	PreAttackType			= PER_SHOT ; Do the delay each time we attack a new target
	FireFX					= FX_GondorSwordHit
	FireFlankFX		= FX_Flanking
	FiringDuration			= 500 ; Duration of the sword swing

	DamageNugget
	    Damage				= GONDOR_TOWERGUARD_DAMAGE
	    DelayTime				= 40
	    DamageType				= SPECIALIST
	    DamageFXType			= SWORD_SLASH
	    DeathType				= NORMAL
	    FlankingBonus = 50%
	    ForbiddenUpgradeNames	= Upgrade_GondorForgedBlades
	End
	
    DamageNugget
		Damage					= GONDOR_TOWERGUARD_FORGEDBLADES_UPGRADE_DAMAGE
		DelayTime				= 40
		DamageType				= SPECIALIST
		DamageFXType				= SWORD_SLASH
		DeathType				= NORMAL
		FlankingBonus = 50%
		RequiredUpgradeNames	= Upgrade_GondorForgedBlades
	End  
  
End

