    DefaultModelConditionState
      Model = CUElk_SKN
    End
  End
  End
KindOf          = STRUCTURE IMMOBILE UNATTACKABLE NOT_AUTOACQUIRABLE 
  

    AddModule
	Behavior = GrantUpgradeCreate ModuleTag_GrantMithrilMail
		UpgradeToGrant = Level1
	End
	End

	AddModule
	Behavior = SubObjectsUpgrade Costume_3
		TriggeredBy		= Level1 ; muwtchkng_mace.tga
		UpgradeTexture	= cuelkm.tga 0 MUAttkTroll_R.tga  ;mubalrogwingsash.tga  ;mubalrogwings.tga  ;mubalrogash.tga  ;fire.tga  ;
				RecolorHouse	= yES
	End


  Geometry = CYLINDER
